<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1100" height="420" fill="#f8fafc"/>
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Shopper Assist — demo flow (illustrative)</text>
  <!-- panel 1 -->
  <rect x="20" y="56" width="320" height="340" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="180" y="82" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">1. Photo of handwritten list</text>
  <g font-family="cursive" font-size="24" fill="#3b3fb5">
    <text x="70" y="140">Coke</text><text x="80" y="180">Fruits</text><text x="85" y="220">Oil</text>
    <text x="80" y="260">Milk</text><text x="90" y="300">Curtains</text>
  </g>
  <g stroke="#cbd5e1"><line x1="40" y1="148" x2="320" y2="148"/><line x1="40" y1="188" x2="320" y2="188"/><line x1="40" y1="228" x2="320" y2="228"/><line x1="40" y1="268" x2="320" y2="268"/><line x1="40" y1="308" x2="320" y2="308"/></g>
  <text x="180" y="360" text-anchor="middle" font-size="12" fill="#64748b">→ Gemini extracts items</text>
  <!-- panel 2 -->
  <rect x="380" y="56" width="320" height="340" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="540" y="82" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">2. Match + stock check</text>
  <g font-size="14" fill="#0f172a">
    <text x="400" y="125">Coke → Beverages</text><text x="400" y="165">Fruits → Produce</text>
    <text x="400" y="205">Oil → Pantry &amp; Dry Goods</text><text x="400" y="245">Milk → Dairy &amp; Eggs</text>
    <text x="400" y="285">Curtains → no match / out of stock</text>
  </g>
  <g fill="#16a34a"><circle cx="388" cy="120" r="4"/><circle cx="388" cy="160" r="4"/><circle cx="388" cy="200" r="4"/><circle cx="388" cy="240" r="4"/></g>
  <circle cx="388" cy="280" r="4" fill="#dc2626"/>
  <text x="540" y="360" text-anchor="middle" font-size="12" fill="#64748b">→ unmatched items are reported, not dropped</text>
  <!-- panel 3 -->
  <rect x="740" y="56" width="340" height="340" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="910" y="82" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">3. Shortest walking route</text>
  <g stroke="#94a3b8" stroke-width="2"><rect x="760" y="100" width="300" height="230" rx="6" fill="#f1f5f9"/></g>
  <g fill="#e2e8f0"><rect x="800" y="130" width="14" height="150"/><rect x="860" y="130" width="14" height="150"/><rect x="920" y="130" width="14" height="150"/><rect x="980" y="130" width="14" height="150"/></g>
  <polyline points="765,215 807,215 807,150 867,150 867,260 927,260 927,170 987,170 987,215 1050,215" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="765" cy="215" r="7" fill="#16a34a"/><circle cx="1050" cy="215" r="7" fill="#dc2626"/>
  <text x="765" y="245" font-size="11" fill="#166534">Entrance</text><text x="1005" y="245" font-size="11" fill="#991b1b">Checkout</text>
  <text x="910" y="360" text-anchor="middle" font-size="12" fill="#64748b">Dijkstra + TSP, drawn as an SVG map</text>
  <g fill="#475569" font-size="28"><text x="345" y="235">›</text><text x="705" y="235">›</text></g>
</svg>
